plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'org.flywaydb.flyway' version '13.9.0'
}

group = 'health.libertycare'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')

	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-hateoas'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
	implementation 'com.mysql:mysql-connector-j:8.4.0'
	implementation 'org.flywaydb:flyway-mysql:13.9.0'
	compileOnly 'org.projectlombok:lombok:1.18.48'
	annotationProcessor 'org.projectlombok:lombok:1.18.48'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}


flyway {
	url = project.findProperty("dbUrl")
	user = project.findProperty('dbUser')
	password = project.findProperty('dbPassword')
}

tasks.named('test') {
	useJUnitPlatform()
}
